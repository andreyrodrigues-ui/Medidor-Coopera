<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medidor Coopera</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Medidor Coopera</h1>

  <form id="form-aparelho">
    <input type="text" id="nome" placeholder="Nome do aparelho" required>
    <input type="number" id="potencia" placeholder="Potência (W)" required>
    <input type="number" id="horas" placeholder="Horas por dia" step="0.1" required>
    <input type="number" id="dias" placeholder="Dias no mês" required>
    <button type="submit">Adicionar aparelho</button>
  </form>

  <ul id="lista-aparelhos"></ul>

  <button id="btn-simular">Simular</button>

  <div id="resultado"></div>

  <script src="app.js"></script>
</body>
</html>
